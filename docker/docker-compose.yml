services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27027:27017"
    volumes:
      - "mongodbData:/data/db"
    networks:
      - backend

    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

networks:
  backend:
volumes:
  mongodbData:


